name: babylm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - torch==2.5.1
    - torchvision
    - torchaudio
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - transformers>=4.40.0
    - datasets>=2.19.0
    - evaluate>=0.4.0
    - accelerate>=0.29.0
    - lm-eval>=0.4.2
    - scikit-learn
    - nltk
    - tqdm
    - numpy
    - pandas
